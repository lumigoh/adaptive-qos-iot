; PlatformIO project for the Critical ESP32 sender.
;
; Board model is NOT confirmed by the repository yet. `esp32dev` is a
; placeholder for a generic ESP32 DevKit; change `board` to match the real
; hardware before flashing. The firmware has not been compiled for or run on
; a device in this repository's checks.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Discover firmware/shared (a plain PlatformIO library with src/).
lib_extra_dirs = ../..
